          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.admission-controller.outputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$TRUSTED_WORKFLOW_SHA" ]]
          python3 .github/scripts/check_task_ritual.py
          .github/scripts/retro-hygiene.sh -R "$GITHUB_REPOSITORY"

  status-publisher:
    name: isolated exact-head status publisher
    needs:
      - admission-controller
      - status-preflight
      - candidate-quality-worker
      - candidate-scaffold-worker
      - candidate-secure-runtime
      - trusted-ledger-worker
    if: >-
      always() &&
      needs.admission-controller.result == 'success' &&
      needs.status-preflight.result == 'success' &&
      needs.admission-controller.outputs.decision == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Independently revalidate and publish fixed contexts
        env:
          TASK35_MODE: publisher
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          API_URL: ${{ github.api_url }}
          GRAPHQL_URL: ${{ github.graphql_url }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          ACCEPTED_PR: ${{ needs.admission-controller.outputs.pr_number }}
          ACCEPTED_HEAD: ${{ needs.admission-controller.outputs.head_sha }}
          ACCEPTED_REPOSITORY: ${{ needs.admission-controller.outputs.head_repository }}
          ACCEPTED_REPOSITORY_ID: ${{ needs.admission-controller.outputs.head_repository_id }}
          ACCEPTED_BASE: ${{ needs.admission-controller.outputs.base_sha }}
          ACCEPTED_CHANGED_FILES: ${{ needs.admission-controller.outputs.changed_files }}
          ACCEPTED_DIFF_DIGEST: ${{ needs.admission-controller.outputs.diff_digest }}
          ACCEPTED_CLASS: ${{ needs.admission-controller.outputs.classification }}
          ACCEPTED_SECURE: ${{ needs.admission-controller.outputs.secure_applicable }}
          DECISION: ${{ needs.admission-controller.outputs.decision }}
          DECISION_REASON: ${{ needs.admission-controller.outputs.reason }}
          ACCEPTED_AUTH_COMMENT: ${{ needs.admission-controller.outputs.auth_comment_id }}
          QUALITY_RESULT: ${{ needs.candidate-quality-worker.result }}
          SCAFFOLD_RESULT: ${{ needs.candidate-scaffold-worker.result }}
          SECURE_RESULT: ${{ needs.candidate-secure-runtime.result }}
          LEDGER_RESULT: ${{ needs.trusted-ledger-worker.result }}
        run: *task35-controller
