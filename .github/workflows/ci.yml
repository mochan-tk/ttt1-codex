# Deterministic ADLC gates. Copied repositories replace the marked placeholder
# with their measured product commands during project onboarding.
name: CI

on:
  pull_request:
    # The Task ledger gate parses the PR body. Re-run it when that body is
    # edited so a previously green task or Plan link cannot go stale.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CUSTOMIZE: replace this copied-template placeholder with the measured
      # build, lint, test, and environment gates recorded by $project-onboarding.
      # Keep .github/scripts/tuning-status.sh until the license trial is accepted.
      - name: Show scaffold onboarding status
        run: .github/scripts/tuning-status.sh --ci

  scaffold-self-check:
    name: scaffold-self-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace and shell syntax
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$DIFF_BASE" && ! "$DIFF_BASE" =~ ^0+$ ]]; then
            git diff --check "$DIFF_BASE" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi
          scaffold_shells=()
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/scripts/*.sh|.agents/*.sh) scaffold_shells+=("$path") ;;
            esac
          done < <(git ls-files -z -- .github/scripts .agents)
          ((${#scaffold_shells[@]} > 0)) || {
            echo "no tracked scaffold shell files found" >&2
            exit 1
          }
          bash -n "${scaffold_shells[@]}"

      - name: Check shell scripts with ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          scaffold_shells=()
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/scripts/*.sh|.agents/*.sh) scaffold_shells+=("$path") ;;
            esac
          done < <(git ls-files -z -- .github/scripts .agents)
          ((${#scaffold_shells[@]} > 0)) || {
            echo "no tracked scaffold shell files found" >&2
            exit 1
          }
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            -S warning "${scaffold_shells[@]}"

      - name: Validate GitHub workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color \
            .github/workflows/ci.yml \
            .github/workflows/retro-hygiene.yml

      - name: Check Markdown links
        run: .github/scripts/check-md-links.sh

      - name: Check Issue form and body-template synchronization
        run: .github/scripts/check-template-sync.sh

      - name: Check Codex skills and scaffold policy
        run: .github/scripts/check-skills.sh

      - name: Check CI guard regressions
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      - name: Check third-party action pins
        run: python3 .github/scripts/check_action_pins.py

      - name: Check the Task ledger ritual
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/check_task_ritual.py

      - name: Build the read-only retro report
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/retro-hygiene.sh -R "$GITHUB_REPOSITORY"
