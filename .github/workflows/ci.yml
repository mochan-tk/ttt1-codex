# Default-branch-owned admission, isolated candidate workers, and a fresh
# status publisher. Candidate-selected workflow events are denied by the
# repository Actions Policy before GitHub evaluates a workflow definition.
name: CI

run-name: CI admission PR #${{ github.event.pull_request.number || github.event.issue.number }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  admission-controller:
    name: base-owned admission controller
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      pr_number: ${{ steps.admit.outputs.pr_number }}
      head_sha: ${{ steps.admit.outputs.head_sha }}
      head_repository: ${{ steps.admit.outputs.head_repository }}
      head_repository_id: ${{ steps.admit.outputs.head_repository_id }}
      base_sha: ${{ steps.admit.outputs.base_sha }}
      changed_files: ${{ steps.admit.outputs.changed_files }}
      diff_digest: ${{ steps.admit.outputs.diff_digest }}
      classification: ${{ steps.admit.outputs.classification }}
      decision: ${{ steps.admit.outputs.decision }}
      reason: ${{ steps.admit.outputs.reason }}
      auth_comment_id: ${{ steps.admit.outputs.auth_comment_id }}
      publish: ${{ steps.admit.outputs.publish }}
      cancel: ${{ steps.admit.outputs.cancel }}
      cancel_scope: ${{ steps.admit.outputs.cancel_scope }}
      run_quality: ${{ steps.admit.outputs.run_quality }}
      run_scaffold: ${{ steps.admit.outputs.run_scaffold }}
      run_secure: ${{ steps.admit.outputs.run_secure }}
      secure_applicable: ${{ steps.admit.outputs.secure_applicable }}
    steps:
      - name: Revalidate and classify the live pull request
        id: admit
        env:
          TASK35_MODE: admission
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          API_URL: ${{ github.api_url }}
          GRAPHQL_URL: ${{ github.graphql_url }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: &task35-controller |
          # TASK35_PROGRAM_BEGIN controller
          python3 -I - <<'PY'
          from __future__ import annotations

          import hashlib
          import http.client
          import json
          import os
          import pathlib
          import posixpath
          import re
          import urllib.error
          import urllib.parse
          import urllib.request


          FULL_SHA = re.compile(r"^[0-9a-f]{40}$")
          REPOSITORY_NAME = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")
          AUTHORIZATION = re.compile(
              r"^/authorize-secure-devcontainer-runtime ([0-9a-f]{40})$"
          )
          PERMITTED_RESULTS = {"success", "failure", "cancelled", "skipped"}
          PERMITTED_PERMISSIONS = {"write", "maintain", "admin"}
          PERMITTED_FILE_STATUS = {
              "added", "changed", "copied", "modified", "removed", "renamed"
          }
          CLASS_SEVERITY = {"safe": 0, "runtime": 1, "bootstrap": 2, "invalid": 3}
          RUNTIME_PREFIXES = (
              ".codex/devcontainer/",
              ".devcontainer/codex-adlc/",
              ".github/scripts/",
          )
          CASE_EXACT_PREFIXES = (
              ".codex/devcontainer/",
              ".devcontainer/codex-adlc/",
          )
          BOOTSTRAP_PREFIXES = (".github/workflows/", ".github/actions/")
          BOOTSTRAP_FILES = {
              ".github/scripts/tests/test_ci_guards.py",
              ".github/scripts/setup-ruleset.sh",
              ".github/CODEOWNERS",
          }
          SECURE_FILES = {
              ".github/scripts/check_devcontainer.py",
              ".github/scripts/materialize_devcontainer.py",
              ".github/scripts/preflight_devcontainer.py",
              ".github/scripts/check-skills.sh",
              ".github/scripts/tests/test_devcontainer.py",
          }
          STATUS_CONTEXTS = (
              "quality",
              "scaffold-self-check",
              "secure-devcontainer",
          )
          WORKER_NAME = re.compile(
              r"^isolated (?:candidate (?:quality|scaffold) worker|"
              r"native runtime worker \(linux/(?:amd64|arm64)\)) "
              r"pr-([1-9][0-9]*) repo-([1-9][0-9]*) "
              r"head-([0-9a-f]{40}) base-([0-9a-f]{40}) "
              r"auth-(0|[1-9][0-9]*)$"
          )
          MAX_PAGES = 31
          MAX_FILES = 3000
          MAX_COMMENTS = 3000


          class GuardError(RuntimeError):
              pass


          def fail(message: str) -> None:
              raise GuardError(message)


          def positive_integer(value: object, field: str) -> int:
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  fail(f"{field} must be a positive integer")
              return value


          def exact_string(value: object, field: str) -> str:
              if not isinstance(value, str) or not value:
                  fail(f"{field} must be a non-empty string")
              return value


          def unique_object(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      fail(f"duplicate JSON key: {key}")
                  result[key] = value
              return result


          def reject_constant(value: str) -> None:
              fail(f"non-finite JSON number: {value}")


          def decode_json(raw: bytes, field: str) -> object:
              try:
                  return json.loads(
                      raw.decode("utf-8", errors="strict"),
                      object_pairs_hook=unique_object,
                      parse_constant=reject_constant,
                  )
              except (UnicodeError, json.JSONDecodeError) as error:
                  raise GuardError(f"{field} is not strict JSON") from error


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):  # noqa: ANN001
                  raise GuardError(f"API redirect refused with status {code}")


          class GitHub:
              def __init__(self) -> None:
                  self.api_url = exact_string(os.environ.get("API_URL"), "API_URL").rstrip("/")
                  self.graphql_url = exact_string(
                      os.environ.get("GRAPHQL_URL"), "GRAPHQL_URL"
                  )
                  self.token = exact_string(os.environ.get("GH_TOKEN"), "GH_TOKEN")
                  self.opener = urllib.request.build_opener(NoRedirect())
                  parsed = urllib.parse.urlsplit(self.api_url)
                  if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                      fail("API_URL must be an absolute HTTP(S) URL")
                  self.api_origin = (parsed.scheme, parsed.netloc)

              def _same_api_origin(self, url: str) -> None:
                  parsed = urllib.parse.urlsplit(url)
                  if (parsed.scheme, parsed.netloc) != self.api_origin:
                      fail("pagination attempted to leave the API origin")

              def request_url(
                  self,
                  url: str,
                  *,
                  method: str = "GET",
                  payload: object | None = None,
                  expected: int = 200,
              ) -> tuple[object, dict[str, str]]:
                  self._same_api_origin(url)
                  body = None
                  if payload is not None:
                      body = json.dumps(
                          payload, separators=(",", ":"), ensure_ascii=True
                      ).encode("utf-8")
                  headers = {
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {self.token}",
                      "User-Agent": "ttt1-codex-base-admission",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }
                  if body is not None:
                      headers["Content-Type"] = "application/json"
                  request = urllib.request.Request(
                      url, data=body, headers=headers, method=method
                  )
                  try:
                      with self.opener.open(request, timeout=20) as response:
                          status = response.status
                          raw = response.read()
                          response_headers = {
                              key.lower(): value for key, value in response.headers.items()
                          }
                  except GuardError:
                      raise
                  except (
                      urllib.error.HTTPError,
                      urllib.error.URLError,
                      http.client.HTTPException,
                      TimeoutError,
                      OSError,
                  ) as error:
                      raise GuardError(f"GitHub API {method} failed") from error
                  if status != expected:
                      fail(f"GitHub API {method} returned unexpected status {status}")
                  result = {} if raw == b"" else decode_json(raw, "GitHub API response")
                  return result, response_headers

              def request(
                  self,
                  path: str,
                  *,
                  method: str = "GET",
                  payload: object | None = None,
                  expected: int = 200,
              ) -> object:
                  if not path.startswith("/"):
                      fail("API path must be absolute")
                  result, _ = self.request_url(
                      f"{self.api_url}{path}",
                      method=method,
                      payload=payload,
                      expected=expected,
                  )
                  return result

              def _next_url(
                  self, headers: dict[str, str], expected_path: str
              ) -> str | None:
                  link = headers.get("link", "")
                  if not link:
                      return None
                  relations: dict[str, str] = {}
                  for part in link.split(","):
                      match = re.fullmatch(
                          r'\s*<([^>]+)>;\s*rel="([A-Za-z]+)"\s*', part
                      )
                      if match is None:
                          fail("pagination Link header is malformed")
                      url, relation = match.groups()
                      if relation in relations:
                          fail("pagination Link header duplicated a relation")
                      self._same_api_origin(url)
                      if urllib.parse.urlsplit(url).path != expected_path:
                          fail("pagination attempted to change the API resource path")
                      relations[relation] = url
                  return relations.get("next")

              def pages(self, path: str, *, limit: int) -> list[object]:
                  if not path.startswith("/"):
                      fail("paginated API path must be absolute")
                  url = f"{self.api_url}{path}"
                  expected_path = urllib.parse.urlsplit(url).path
                  visited: set[str] = set()
                  items: list[object] = []
                  for _ in range(MAX_PAGES):
                      if url in visited:
                          fail("pagination cursor stalled or cycled")
                      visited.add(url)
                      page, headers = self.request_url(url)
                      if not isinstance(page, list):
                          fail("paginated API response is not an array")
                      items.extend(page)
                      if len(items) > limit:
                          fail("paginated API response exceeded its bound")
                      next_url = self._next_url(headers, expected_path)
                      if next_url is None:
                          return items
                      url = next_url
                  fail("pagination exceeded its page budget")

              def object_pages(self, path: str, field: str, *, limit: int) -> list[object]:
                  if not path.startswith("/"):
                      fail("paginated API path must be absolute")
                  url = f"{self.api_url}{path}"
                  expected_path = urllib.parse.urlsplit(url).path
                  visited: set[str] = set()
                  items: list[object] = []
                  for _ in range(MAX_PAGES):
                      if url in visited:
                          fail("pagination cursor stalled or cycled")
                      visited.add(url)
                      page, headers = self.request_url(url)
                      if not isinstance(page, dict) or not isinstance(page.get(field), list):
                          fail(f"paginated API response has no {field} array")
                      records = page[field]
                      items.extend(records)
                      if len(items) > limit:
                          fail("paginated API response exceeded its bound")
                      total = page.get("total_count")
                      if isinstance(total, bool) or not isinstance(total, int) or total < 0:
                          fail("paginated API response has an invalid total_count")
                      next_url = self._next_url(headers, expected_path)
                      if next_url is None:
                          if len(items) != total:
                              fail("paginated API response is incomplete")
                          return items
                      url = next_url
                  fail("pagination exceeded its page budget")

              def graphql(self, query: str, variables: dict[str, object]) -> dict[str, object]:
                  parsed = urllib.parse.urlsplit(self.graphql_url)
                  if (parsed.scheme, parsed.netloc) != self.api_origin:
                      fail("GraphQL URL must share the API origin")
                  result, _ = self.request_url(
                      self.graphql_url,
                      method="POST",
                      payload={"query": query, "variables": variables},
                  )
                  if not isinstance(result, dict) or result.get("errors"):
                      fail("GraphQL returned errors or a malformed response")
                  data = result.get("data")
                  if not isinstance(data, dict):
                      fail("GraphQL response data is missing")
                  return data


          def require_repository() -> tuple[str, int, str]:
              repository = exact_string(os.environ.get("REPOSITORY"), "REPOSITORY")
              if REPOSITORY_NAME.fullmatch(repository) is None:
                  fail("REPOSITORY is not owner/repo")
              repository_id_raw = exact_string(
                  os.environ.get("REPOSITORY_ID"), "REPOSITORY_ID"
              )
              if not repository_id_raw.isdecimal() or repository_id_raw.startswith("0"):
                  fail("REPOSITORY_ID is not canonical positive decimal")
              repository_id = int(repository_id_raw)
              owner = repository.split("/", 1)[0]
              return repository, repository_id, owner


          def workflow_path_is_ci(value: object, base_ref: object) -> bool:
              if not isinstance(value, str) or not isinstance(base_ref, str):
                  return False
              return value in {
                  ".github/workflows/ci.yml",
                  f".github/workflows/ci.yml@{base_ref}",
              }


          def repository_default_branch(
              github: GitHub, repository: str, repository_id: int
          ) -> str:
              metadata = github.request(f"/repos/{repository}")
              if (
                  not isinstance(metadata, dict)
                  or metadata.get("id") != repository_id
                  or metadata.get("full_name") != repository
              ):
                  fail("repository metadata does not match the trusted environment")
              return exact_string(
                  metadata.get("default_branch"), "repository default branch"
              )


          def snapshot(raw: object, repository: str, repository_id: int) -> dict[str, object]:
              if not isinstance(raw, dict):
                  fail("pull request response is not an object")
              number = positive_integer(raw.get("number"), "pull request number")
              if raw.get("state") != "open":
                  fail("pull request is not open")
              changed_files = raw.get("changed_files")
              if (
                  isinstance(changed_files, bool)
                  or not isinstance(changed_files, int)
                  or not 0 < changed_files <= MAX_FILES
              ):
                  fail("pull request changed_files is outside the supported bound")

              def side(name: str) -> tuple[str, int, str, str]:
                  value = raw.get(name)
                  if not isinstance(value, dict):
                      fail(f"pull request {name} is malformed")
                  sha = exact_string(value.get("sha"), f"pull request {name} SHA")
                  if FULL_SHA.fullmatch(sha) is None:
                      fail(f"pull request {name} SHA is not lowercase 40-hex")
                  repo = value.get("repo")
                  if not isinstance(repo, dict):
                      fail(f"pull request {name} repository is missing")
                  repo_id = positive_integer(repo.get("id"), f"pull request {name} repo id")
                  full_name = exact_string(
                      repo.get("full_name"), f"pull request {name} repo full_name"
                  )
                  if REPOSITORY_NAME.fullmatch(full_name) is None:
                      fail(f"pull request {name} repo full_name is invalid")
                  ref = exact_string(value.get("ref"), f"pull request {name} ref")
                  return sha, repo_id, full_name, ref

              head_sha, head_repo_id, head_repository, head_ref = side("head")
              base_sha, base_repo_id, base_repository, base_ref = side("base")
              if base_repo_id != repository_id or base_repository != repository:
                  fail("pull request base repository identity drifted")
              author = raw.get("user")
              if not isinstance(author, dict) or author.get("type") != "User":
                  fail("pull request author is not a canonical User")
              author_id = positive_integer(author.get("id"), "pull request author id")
              author_login = exact_string(author.get("login"), "pull request author login")
              return {
                  "number": number,
                  "head_sha": head_sha,
                  "head_repo_id": head_repo_id,
                  "head_repository": head_repository,
                  "head_ref": head_ref,
                  "base_sha": base_sha,
                  "base_repo_id": base_repo_id,
                  "base_repository": base_repository,
                  "base_ref": base_ref,
                  "changed_files": changed_files,
                  "author_id": author_id,
                  "author_login": author_login,
              }


          def normalize_path(raw: object) -> str:
              if (
                  not isinstance(raw, str)
                  or not raw
                  or "\\" in raw
                  or any(ord(character) < 32 or ord(character) == 127 for character in raw)
              ):
                  fail("changed-file path is malformed")
              if raw.startswith("/"):
                  fail("changed-file path is absolute")
              normalized = posixpath.normpath(raw)
              if normalized in {"", ".", ".."} or normalized.startswith("../"):
                  fail("changed-file path escapes the repository")
              if normalized.startswith("/"):
                  fail("normalized changed-file path is absolute")
              return normalized


          def path_class(path: str) -> str:
              for prefix in CASE_EXACT_PREFIXES:
                  if path.casefold().startswith(prefix.casefold()) and not path.startswith(prefix):
                      return "invalid"
              if path in BOOTSTRAP_FILES or path.startswith(BOOTSTRAP_PREFIXES):
                  return "bootstrap"
              if path.startswith(RUNTIME_PREFIXES):
                  return "runtime"
              return "safe"


          def classify_files(
              raw_files: list[object], expected_count: int
          ) -> tuple[str, str, bool]:
              if len(raw_files) != expected_count:
                  fail("changed-file count does not match the complete paginated response")
              seen_current: set[str] = set()
              seen_records: set[tuple[str, str, str]] = set()
              severity = 0
              secure_applicable = False
              canonical: list[tuple[str, str, str]] = []
              for raw in raw_files:
                  if not isinstance(raw, dict):
                      fail("changed-file record is not an object")
                  status = raw.get("status")
                  if status not in PERMITTED_FILE_STATUS:
                      fail("changed-file status is unknown")
                  filename = normalize_path(raw.get("filename"))
                  previous = raw.get("previous_filename")
                  if status == "renamed":
                      previous_name = normalize_path(previous)
                  else:
                      if previous is not None:
                          fail("non-rename record unexpectedly has previous_filename")
                      previous_name = ""
                  if filename in seen_current:
                      fail("changed-file response contains a duplicate filename")
                  seen_current.add(filename)
                  record = (status, filename, previous_name)
                  if record in seen_records:
                      fail("changed-file response contains a duplicate record")
                  seen_records.add(record)
                  canonical.append(record)
                  for candidate in (filename, previous_name):
                      if not candidate:
                          continue
                      severity = max(severity, CLASS_SEVERITY[path_class(candidate)])
                      if (
                          candidate.startswith(CASE_EXACT_PREFIXES)
                          or candidate in SECURE_FILES
                      ):
                          secure_applicable = True
              classification = next(
                  name for name, value in CLASS_SEVERITY.items() if value == severity
              )
              digest = hashlib.sha256(
                  json.dumps(sorted(canonical), separators=(",", ":")).encode("utf-8")
              ).hexdigest()
              return classification, digest, secure_applicable


          def assert_same(left: dict[str, object], right: dict[str, object], field: str) -> None:
              if left != right:
                  fail(f"pull request identity drifted during {field}")


          def read_bound(
              github: GitHub,
              repository: str,
              repository_id: int,
              pr_number: int,
          ) -> tuple[dict[str, object], str, str, bool]:
              def repository_state() -> tuple[str, int, str, str]:
                  metadata = github.request(f"/repos/{repository}")
                  if not isinstance(metadata, dict):
                      fail("repository metadata is malformed")
                  if (
                      metadata.get("id") != repository_id
                      or metadata.get("full_name") != repository
                  ):
                      fail("repository metadata identity drifted")
                  default = exact_string(
                      metadata.get("default_branch"), "repository default branch"
                  )
                  owner = metadata.get("owner")
                  if not isinstance(owner, dict):
                      fail("repository owner metadata is malformed")
                  owner_type = owner.get("type")
                  if owner_type not in {"User", "Organization"}:
                      fail("repository owner metadata is malformed")
                  owner_id = positive_integer(owner.get("id"), "repository owner id")
                  owner_login = exact_string(
                      owner.get("login"), "repository owner login"
                  )
                  if owner_login.casefold() != repository.split("/", 1)[0].casefold():
                      fail("repository owner identity drifted")
                  return default, owner_id, owner_login, str(owner_type)

              initial_repository_state = repository_state()
              default_branch = initial_repository_state[0]
              raw_a = github.request(f"/repos/{repository}/pulls/{pr_number}")
              snap_a = snapshot(raw_a, repository, repository_id)
              if snap_a["number"] != pr_number:
                  fail("pull request number does not match the requested resource")
              if snap_a["base_ref"] != default_branch:
                  fail("pull request does not target the live default branch")
              files = github.pages(
                  f"/repos/{repository}/pulls/{pr_number}/files?per_page=100",
                  limit=MAX_FILES,
              )
              raw_b = github.request(f"/repos/{repository}/pulls/{pr_number}")
              snap_b = snapshot(raw_b, repository, repository_id)
              assert_same(snap_a, snap_b, "diff pagination")
              classification, digest, secure_applicable = classify_files(
                  files, int(snap_a["changed_files"])
              )
              raw_c = github.request(f"/repos/{repository}/pulls/{pr_number}")
              snap_c = snapshot(raw_c, repository, repository_id)
              assert_same(snap_a, snap_c, "classification")
              if repository_state() != initial_repository_state:
                  fail("repository metadata drifted during admission")
              if snap_c["base_ref"] != default_branch:
                  fail("pull request no longer targets the live default branch")
              return snap_a, classification, digest, secure_applicable


          COMMENT_QUERY = """
          query Task35CommentEditState($ids: [ID!]!) {
            nodes(ids: $ids) {
              __typename
              ... on IssueComment {
                id
                databaseId
                body
                createdAt
                lastEditedAt
                includesCreatedEdit
                userContentEdits { totalCount }
              }
            }
          }
          """


          def eligible_author(
              github: GitHub,
              repository: str,
              snap: dict[str, object],
              user: object,
          ) -> bool:
              if not isinstance(user, dict) or user.get("type") != "User":
                  return False
              identifier = positive_integer(user.get("id"), "comment author id")
              login = exact_string(user.get("login"), "comment author login")
              if identifier == snap["author_id"]:
                  return False
              encoded_login = urllib.parse.quote(login, safe="")
              permission = github.request(
                  f"/repos/{repository}/collaborators/{encoded_login}/permission"
              )
              if not isinstance(permission, dict):
                  fail("collaborator permission response is malformed")
              permission_user = permission.get("user")
              if (
                  not isinstance(permission_user, dict)
                  or permission_user.get("id") != identifier
                  or permission_user.get("login") != login
                  or permission_user.get("type") != "User"
              ):
                  fail("collaborator identity does not match the comment author")
              return permission.get("permission") in PERMITTED_PERMISSIONS


          def prior_authorization_binding(
              github: GitHub,
              repository: str,
              repository_id: int,
              snap: dict[str, object],
              comment_id: int,
              user: object,
          ) -> bool:
              if not isinstance(user, dict) or user.get("type") != "User":
                  return False
              identifier = positive_integer(user.get("id"), "comment author id")
              exact_string(user.get("login"), "comment author login")
              if identifier == snap["author_id"]:
                  return False
              server_url = exact_string(
                  os.environ.get("SERVER_URL"), "SERVER_URL"
              ).rstrip("/")
              current_run = int(expected_value("RUN_ID", r"[1-9][0-9]*"))
              prefix = f"{server_url}/{repository}/actions/runs/"
              contexts_by_run: dict[int, set[str]] = {}
              statuses = github.pages(
                  f"/repos/{repository}/commits/{snap['head_sha']}/statuses?per_page=100",
                  limit=3000,
              )
              for raw in statuses:
                  if not isinstance(raw, dict):
                      fail("commit-status record is malformed")
                  context = raw.get("context")
                  if context not in STATUS_CONTEXTS:
                      continue
                  target_url = raw.get("target_url")
                  if not isinstance(target_url, str) or not target_url.startswith(prefix):
                      continue
                  suffix = target_url.removeprefix(prefix)
                  if not suffix.isdecimal() or suffix.startswith("0"):
                      continue
                  contexts_by_run.setdefault(int(suffix), set()).add(str(context))
              for run_id, contexts in contexts_by_run.items():
                  if run_id == current_run or contexts != set(STATUS_CONTEXTS):
                      continue
                  run = github.request(f"/repos/{repository}/actions/runs/{run_id}")
                  run_repository = run.get("repository") if isinstance(run, dict) else None
                  if (
                      not isinstance(run, dict)
                      or run.get("id") != run_id
                      or not workflow_path_is_ci(run.get("path"), snap["base_ref"])
                      or run.get("event") != "issue_comment"
                      or run.get("display_title")
                      != f"CI admission PR #{snap['number']}"
                      or not isinstance(run_repository, dict)
                      or run_repository.get("id") != repository_id
                      or run_repository.get("full_name") != repository
                  ):
                      continue
                  jobs = github.object_pages(
                      f"/repos/{repository}/actions/runs/{run_id}/jobs?filter=all&per_page=100",
                      "jobs",
                      limit=3000,
                  )
                  bindings: set[tuple[int, int, str, str, int]] = set()
                  for job in jobs:
                      if not isinstance(job, dict) or not isinstance(job.get("name"), str):
                          fail("workflow job record is malformed")
                      match = WORKER_NAME.fullmatch(job["name"])
                      status = job.get("status")
                      conclusion = job.get("conclusion")
                      started = (
                          status in {"queued", "in_progress"} and conclusion is None
                      ) or (
                          status == "completed"
                          and conclusion
                          in {
                              "success", "failure", "cancelled", "timed_out",
                              "neutral", "action_required", "stale",
                          }
                      )
                      if match and started:
                          bindings.add(
                              (
                                  int(match.group(1)),
                                  int(match.group(2)),
                                  match.group(3),
                                  match.group(4),
                                  int(match.group(5)),
                              )
                          )
                  if any(
                      binding[0] == snap["number"]
                      and binding[1] == snap["head_repo_id"]
                      and binding[2] == snap["head_sha"]
                      and binding[4] == comment_id
                      for binding in bindings
                  ):
                      return True
              return False


          def live_authorizations(
              github: GitHub,
              repository: str,
              owner: str,
              snap: dict[str, object],
          ) -> set[int]:
              comments = github.pages(
                  f"/repos/{repository}/issues/{snap['number']}/comments?per_page=100",
                  limit=MAX_COMMENTS,
              )
              ids: set[int] = set()
              exact: list[dict[str, object]] = []
              expected_body = f"/authorize-secure-devcontainer-runtime {snap['head_sha']}"
              for raw in comments:
                  if not isinstance(raw, dict):
                      fail("Issue comment record is not an object")
                  identifier = positive_integer(raw.get("id"), "Issue comment id")
                  if identifier in ids:
                      fail("Issue comment pagination returned a duplicate id")
                  ids.add(identifier)
                  body = raw.get("body")
                  if not isinstance(body, str):
                      fail("Issue comment body is not a string")
                  if body != expected_body:
                      continue
                  expected_issue_url = f"{github.api_url}/repos/{repository}/issues/{snap['number']}"
                  if raw.get("issue_url") != expected_issue_url:
                      fail("authorization comment is not bound to the pull request Issue")
                  node_id = exact_string(raw.get("node_id"), "Issue comment node id")
                  user = raw.get("user")
                  if not isinstance(user, dict):
                      fail("Issue comment author is malformed")
                  exact.append(
                      {
                          "id": identifier,
                          "node_id": node_id,
                          "body": body,
                          "user_id": positive_integer(user.get("id"), "comment author id"),
                          "login": exact_string(user.get("login"), "comment author login"),
                          "type": user.get("type"),
                          "created_at": raw.get("created_at"),
                          "updated_at": raw.get("updated_at"),
                      }
                  )
              valid: set[int] = set()
              for start in range(0, len(exact), 50):
                  batch = exact[start : start + 50]
                  data = github.graphql(
                      COMMENT_QUERY, {"ids": [item["node_id"] for item in batch]}
                  )
                  nodes = data.get("nodes")
                  if not isinstance(nodes, list) or len(nodes) != len(batch):
                      fail("GraphQL comment edit-state response is incomplete")
                  by_node = {item["node_id"]: item for item in batch}
                  seen_nodes: set[str] = set()
                  for node in nodes:
                      if not isinstance(node, dict) or node.get("__typename") != "IssueComment":
                          fail("GraphQL returned a non-IssueComment node")
                      node_id = exact_string(node.get("id"), "GraphQL comment node id")
                      if node_id in seen_nodes or node_id not in by_node:
                          fail("GraphQL comment nodes are duplicated or unexpected")
                      seen_nodes.add(node_id)
                      item = by_node[node_id]
                      if (
                          node.get("databaseId") != item["id"]
                          or node.get("body") != item["body"]
                          or node.get("createdAt") != item["created_at"]
                      ):
                          fail("REST and GraphQL comment state disagree")
                      edits = node.get("userContentEdits")
                      if not isinstance(edits, dict):
                          fail("GraphQL comment edit-state response is malformed")
                      if (
                          node.get("lastEditedAt") is not None
                          or node.get("includesCreatedEdit") is not False
                          or edits.get("totalCount") != 0
                          or not isinstance(item["created_at"], str)
                          or item["created_at"] != item["updated_at"]
                      ):
                          continue
                      if eligible_author(
                          github,
                          repository,
                          snap,
                          {
                              "id": item["user_id"],
                              "login": item["login"],
                              "type": item["type"],
                          },
                      ):
                          valid.add(int(item["id"]))
                  if seen_nodes != set(by_node):
                      fail("GraphQL omitted an authorization comment")
              return valid


          def event_revokes_authorization(
              github: GitHub,
              repository: str,
              repository_id: int,
              snap: dict[str, object],
              event: dict[str, object],
          ) -> str:
              action = event.get("action")
              if action not in {"edited", "deleted"}:
                  return "none"
              comment = event.get("comment")
              if not isinstance(comment, dict):
                  fail("authorization revocation event has no comment")
              comment_id = positive_integer(comment.get("id"), "event comment id")
              expected = f"/authorize-secure-devcontainer-runtime {snap['head_sha']}"
              if action == "deleted":
                  if comment.get("body") != expected:
                      return "none"
                  expected_issue_url = (
                      f"{github.api_url}/repos/{repository}/issues/{snap['number']}"
                  )
                  if comment.get("issue_url") != expected_issue_url:
                      return "none"
                  user = comment.get("user")
                  if prior_authorization_binding(
                      github, repository, repository_id, snap, comment_id, user
                  ):
                      return "bound"
                  created = comment.get("created_at")
                  if not isinstance(created, str) or created != comment.get("updated_at"):
                      return "none"
                  return (
                      "eligible"
                      if eligible_author(github, repository, snap, user)
                      else "none"
                  )

              changes = event.get("changes")
              body_change = changes.get("body") if isinstance(changes, dict) else None
              if not isinstance(body_change, dict) or body_change.get("from") != expected:
                  return "none"
              expected_issue_url = (
                  f"{github.api_url}/repos/{repository}/issues/{snap['number']}"
              )
              if comment.get("issue_url") != expected_issue_url:
                  return "none"
              event_user = comment.get("user")
              if prior_authorization_binding(
                  github, repository, repository_id, snap, comment_id, event_user
              ):
                  return "bound"
              live = github.request(
                  f"/repos/{repository}/issues/comments/{comment_id}"
              )
              if not isinstance(live, dict) or live.get("id") != comment_id:
                  fail("edited authorization comment could not be rebound")
              for field in ("body", "created_at", "updated_at", "node_id"):
                  if not isinstance(live.get(field), str):
                      fail("edited authorization comment is malformed")
              if live.get("issue_url") != expected_issue_url:
                  fail("edited authorization comment belongs to another Issue")
              live_user = live.get("user")
              if not isinstance(event_user, dict) or not isinstance(live_user, dict):
                  fail("edited authorization author is malformed")
              if (
                  event_user.get("id") != live_user.get("id")
                  or event_user.get("login") != live_user.get("login")
                  or event_user.get("type") != live_user.get("type")
              ):
                  fail("edited authorization author identity drifted")
              for field in ("id", "body", "created_at", "updated_at", "node_id", "issue_url"):
                  if comment.get(field) != live.get(field):
                      fail("edited authorization event and live comment disagree")
              data = github.graphql(COMMENT_QUERY, {"ids": [live["node_id"]]})
              nodes = data.get("nodes")
              if not isinstance(nodes, list) or len(nodes) != 1:
                  fail("edited authorization history is incomplete")
              node = nodes[0]
              edits = node.get("userContentEdits") if isinstance(node, dict) else None
              if (
                  not isinstance(node, dict)
                  or node.get("__typename") != "IssueComment"
                  or node.get("id") != live["node_id"]
                  or node.get("databaseId") != comment_id
                  or node.get("body") != live["body"]
                  or node.get("createdAt") != live["created_at"]
                  or node.get("lastEditedAt") != live["updated_at"]
                  or node.get("includesCreatedEdit") is not True
                  or not isinstance(edits, dict)
                  or not isinstance(edits.get("totalCount"), int)
                  or isinstance(edits.get("totalCount"), bool)
                  or edits.get("totalCount") != 2
              ):
                  return "none"
              return (
                  "eligible"
                  if eligible_author(github, repository, snap, live_user)
                  else "none"
              )


          def event_document(repository: str, repository_id: int) -> dict[str, object]:
              path = pathlib.Path(exact_string(os.environ.get("EVENT_PATH"), "EVENT_PATH"))
              try:
                  raw = path.read_bytes()
              except OSError as error:
                  raise GuardError("event payload could not be read") from error
              event = decode_json(raw, "event payload")
              if not isinstance(event, dict):
                  fail("event payload is not an object")
              event_repository = event.get("repository")
              if (
                  not isinstance(event_repository, dict)
                  or event_repository.get("full_name") != repository
                  or event_repository.get("id") != repository_id
              ):
                  fail("event repository identity does not match the trusted environment")
              return event


          def output(name: str, value: object) -> None:
              allowed = {
                  "pr_number": r"[1-9][0-9]*",
                  "head_sha": r"[0-9a-f]{40}",
                  "head_repository": r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+",
                  "head_repository_id": r"[1-9][0-9]*",
                  "base_sha": r"[0-9a-f]{40}",
                  "changed_files": r"0|[1-9][0-9]*",
                  "diff_digest": r"[0-9a-f]{64}",
                  "classification": r"safe|runtime|bootstrap|invalid|none",
                  "decision": r"release|pending|failure|noop",
                  "reason": r"[a-z0-9-]+",
                  "auth_comment_id": r"0|[1-9][0-9]*",
                  "publish": r"true|false",
                  "cancel": r"true|false",
                  "cancel_scope": r"none|prior-head|current-head",
                  "run_quality": r"true|false",
                  "run_scaffold": r"true|false",
                  "run_secure": r"true|false",
                  "secure_applicable": r"true|false",
              }
              text = str(value)
              if name not in allowed or re.fullmatch(allowed[name], text) is None:
                  fail(f"unsafe workflow output for {name}")
              output_path = pathlib.Path(
                  exact_string(os.environ.get("GITHUB_OUTPUT"), "GITHUB_OUTPUT")
              )
              with output_path.open("a", encoding="utf-8", newline="\n") as stream:
                  stream.write(f"{name}={text}\n")


          def emit_noop() -> None:
              values = {
                  "pr_number": "1",
                  "head_sha": "0" * 40,
                  "head_repository": "none/none",
                  "head_repository_id": "1",
                  "base_sha": "0" * 40,
                  "changed_files": "0",
                  "diff_digest": "0" * 64,
                  "classification": "none",
                  "decision": "noop",
                  "reason": "not-a-pull-request",
                  "auth_comment_id": "0",
                  "publish": "false",
                  "cancel": "false",
                  "cancel_scope": "none",
                  "run_quality": "false",
                  "run_scaffold": "false",
                  "run_secure": "false",
                  "secure_applicable": "false",
              }
              for name, value in values.items():
                  output(name, value)


          def event_pr_number(event_name: str, event: dict[str, object]) -> int | None:
              action = event.get("action")
              if event_name == "pull_request_target":
                  if action not in {"opened", "synchronize", "reopened", "edited"}:
                      fail("unexpected pull_request_target action")
                  pr = event.get("pull_request")
                  if not isinstance(pr, dict):
                      fail("pull_request_target payload has no pull request")
                  return positive_integer(pr.get("number"), "event pull request number")
              if event_name == "issue_comment":
                  if action not in {"created", "edited", "deleted"}:
                      fail("unexpected issue_comment action")
                  issue = event.get("issue")
                  if not isinstance(issue, dict):
                      fail("issue_comment payload has no Issue")
                  if not isinstance(issue.get("pull_request"), dict):
                      return None
                  return positive_integer(issue.get("number"), "event Issue number")
              fail("workflow received a non-allowlisted event")


          def admission() -> None:
              repository, repository_id, owner = require_repository()
              github = GitHub()
              event_name = exact_string(os.environ.get("EVENT_NAME"), "EVENT_NAME")
              event = event_document(repository, repository_id)
              pr_number = event_pr_number(event_name, event)
              if pr_number is None:
                  emit_noop()
                  return
              snap, classification, digest, secure_applicable = read_bound(
                  github, repository, repository_id, pr_number
              )
              decision = "pending"
              reason = "authorization-required"
              publish = True
              cancel = event_name == "pull_request_target" and event.get("action") == "synchronize"
              cancel_scope = "prior-head" if cancel else "none"
              run_quality = False
              run_scaffold = False
              run_secure = False
              auth_comment_id = 0
              same_repository = (
                  snap["head_repo_id"] == snap["base_repo_id"]
                  and snap["head_repository"] == snap["base_repository"]
              )

              if event_name == "pull_request_target":
                  if classification in {"bootstrap", "invalid"}:
                      decision = "failure"
                      reason = f"{classification}-change"
                  elif same_repository and classification == "safe":
                      fresh_snap, fresh_class, fresh_digest, fresh_secure = read_bound(
                          github, repository, repository_id, pr_number
                      )
                      if (fresh_snap, fresh_class, fresh_digest, fresh_secure) != (
                          snap, classification, digest, secure_applicable
                      ):
                          fail("pull request drifted before safe release")
                      decision = "release"
                      reason = "same-repository-safe"
                      run_quality = True
                      run_scaffold = True
                  else:
                      reason = "human-authorization-required"
              else:
                  action = event.get("action")
                  comment = event.get("comment")
                  comment_id = None
                  if isinstance(comment, dict) and comment.get("id") is not None:
                      comment_id = positive_integer(comment.get("id"), "event comment id")
                  if action == "created":
                      valid = live_authorizations(github, repository, owner, snap)
                      if comment_id not in valid:
                          decision = "noop"
                          reason = "irrelevant-comment"
                          publish = False
                      elif classification in {"bootstrap", "invalid"}:
                          decision = "failure"
                          reason = f"{classification}-change"
                      else:
                          if same_repository and classification == "safe":
                              decision = "noop"
                              reason = "authorization-not-required"
                              publish = False
                              values = {
                                  "pr_number": snap["number"],
                                  "head_sha": snap["head_sha"],
                                  "head_repository": snap["head_repository"],
                                  "head_repository_id": snap["head_repo_id"],
                                  "base_sha": snap["base_sha"],
                                  "changed_files": snap["changed_files"],
                                  "diff_digest": digest,
                                  "classification": classification,
                                  "decision": decision,
                                  "reason": reason,
                                  "auth_comment_id": "0",
                                  "publish": "false",
                                  "cancel": "false",
                                  "cancel_scope": "none",
                                  "run_quality": "false",
                                  "run_scaffold": "false",
                                  "run_secure": "false",
                                  "secure_applicable": str(secure_applicable).lower(),
                              }
                              for name, value in values.items():
                                  output(name, value)
                              print("admission decision=noop classification=safe reason=authorization-not-required")
                              return
                          if valid != {comment_id}:
                              fail("authorization must be the sole live exact comment")
                          fresh_snap, fresh_class, fresh_digest, fresh_secure = read_bound(
                              github, repository, repository_id, pr_number
                          )
                          if (fresh_snap, fresh_class, fresh_digest, fresh_secure) != (
                              snap, classification, digest, secure_applicable
                          ):
                              fail("pull request drifted before authorized release")
                          fresh_valid = live_authorizations(
                              github, repository, owner, fresh_snap
                          )
                          if fresh_valid != {comment_id}:
                              fail("authorization changed before release")
                          decision = "release"
                          reason = "exact-human-authorization"
                          auth_comment_id = comment_id
                          run_quality = True
                          run_scaffold = True
                          run_secure = secure_applicable
                  else:
                      if same_repository and classification == "safe":
                          revocation = "none"
                          decision = "noop"
                          reason = "authorization-not-required"
                          publish = False
                      else:
                          revocation = event_revokes_authorization(
                              github, repository, repository_id, snap, event
                          )
                      if revocation == "none" and decision != "noop":
                          decision = "noop"
                          reason = "irrelevant-comment"
                          publish = False
                      elif revocation != "none":
                          valid = (
                              set()
                              if revocation == "bound"
                              else live_authorizations(github, repository, owner, snap)
                          )
                          if valid:
                              decision = "noop"
                              reason = "authorization-still-valid"
                              publish = False
                          else:
                              fresh_snap, fresh_class, fresh_digest, fresh_secure = read_bound(
                                  github, repository, repository_id, pr_number
                              )
                              if (fresh_snap, fresh_class, fresh_digest, fresh_secure) != (
                                  snap, classification, digest, secure_applicable
                              ):
                                  fail("pull request drifted during authorization revocation")
                              decision = "failure"
                              reason = "authorization-revoked"
                              comment = event.get("comment")
                              if not isinstance(comment, dict):
                                  fail("authorization revocation lost its event comment")
                              auth_comment_id = positive_integer(
                                  comment.get("id"), "revoked authorization comment id"
                              )
                              cancel = True
                              cancel_scope = "current-head"

              values = {
                  "pr_number": snap["number"],
                  "head_sha": snap["head_sha"],
                  "head_repository": snap["head_repository"],
                  "head_repository_id": snap["head_repo_id"],
                  "base_sha": snap["base_sha"],
                  "changed_files": snap["changed_files"],
                  "diff_digest": digest,
                  "classification": classification,
                  "decision": decision,
                  "reason": reason,
                  "auth_comment_id": auth_comment_id,
                  "publish": str(publish).lower(),
                  "cancel": str(cancel).lower(),
                  "cancel_scope": cancel_scope,
                  "run_quality": str(run_quality).lower(),
                  "run_scaffold": str(run_scaffold).lower(),
                  "run_secure": str(run_secure).lower(),
                  "secure_applicable": str(secure_applicable).lower(),
              }
              for name, value in values.items():
                  output(name, value)
              print(f"admission decision={decision} classification={classification} reason={reason}")


          def expected_value(name: str, pattern: str) -> str:
              value = exact_string(os.environ.get(name), name)
              if re.fullmatch(pattern, value) is None:
                  fail(f"{name} is outside the fixed output contract")
              return value


          def publisher() -> None:
              repository, repository_id, owner = require_repository()
              github = GitHub()
              mode = expected_value("TASK35_MODE", r"preflight|publisher")
              pr_number = int(expected_value("ACCEPTED_PR", r"[1-9][0-9]*"))
              expected_head = expected_value("ACCEPTED_HEAD", r"[0-9a-f]{40}")
              expected_head_repository = expected_value(
                  "ACCEPTED_REPOSITORY", r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
              )
              expected_head_repository_id = int(
                  expected_value("ACCEPTED_REPOSITORY_ID", r"[1-9][0-9]*")
              )
              expected_base = expected_value("ACCEPTED_BASE", r"[0-9a-f]{40}")
              expected_changed_files = int(
                  expected_value("ACCEPTED_CHANGED_FILES", r"[1-9][0-9]*")
              )
              expected_diff_digest = expected_value(
                  "ACCEPTED_DIFF_DIGEST", r"[0-9a-f]{64}"
              )
              expected_class = expected_value(
                  "ACCEPTED_CLASS", r"safe|runtime|bootstrap|invalid"
              )
              expected_secure = expected_value("ACCEPTED_SECURE", r"true|false") == "true"
              decision = expected_value("DECISION", r"release|pending|failure")
              reason = expected_value("DECISION_REASON", r"[a-z0-9-]+")
              expected_auth_comment = int(
                  expected_value("ACCEPTED_AUTH_COMMENT", r"0|[1-9][0-9]*")
              )
              expected_identity = (
                  expected_head,
                  expected_head_repository,
                  expected_head_repository_id,
                  expected_base,
                  expected_changed_files,
                  expected_diff_digest,
                  expected_class,
                  expected_secure,
              )

              def revalidate() -> tuple[dict[str, object], str, bool]:
                  snap, classification, digest, secure_applicable = read_bound(
                      github, repository, repository_id, pr_number
                  )
                  live_identity = (
                      snap["head_sha"],
                      snap["head_repository"],
                      snap["head_repo_id"],
                      snap["base_sha"],
                      snap["changed_files"],
                      digest,
                      classification,
                      secure_applicable,
                  )
                  if live_identity != expected_identity:
                      fail("publisher rejected stale admission identity or classification")
                  same_repository = (
                      snap["head_repo_id"] == snap["base_repo_id"]
                      and snap["head_repository"] == snap["base_repository"]
                  )
                  authorization_required = classification == "runtime" or not same_repository
                  if decision == "release" and authorization_required:
                      if expected_auth_comment <= 0:
                          fail("publisher has no bound authorization comment id")
                      if live_authorizations(github, repository, owner, snap) != {
                          expected_auth_comment
                      }:
                          fail("publisher rejected authorization identity drift")
                      check_snap, check_class, check_digest, check_secure = read_bound(
                          github, repository, repository_id, pr_number
                      )
                      if (
                          check_snap != snap
                          or check_class != classification
                          or check_digest != digest
                          or check_secure != secure_applicable
                      ):
                          fail("publisher observed drift after authorization")
                  elif decision == "release" and expected_auth_comment != 0:
                      fail("safe same-repository release unexpectedly carries authorization")
                  return snap, classification, secure_applicable

              results: dict[str, str] = {}
              if mode == "publisher":
                  ledger_result = expected_value("LEDGER_RESULT", r"[a-z]+")
                  results = {
                      "quality": expected_value("QUALITY_RESULT", r"[a-z]+"),
                      "scaffold-self-check": expected_value("SCAFFOLD_RESULT", r"[a-z]+"),
                      "secure-devcontainer": expected_value("SECURE_RESULT", r"[a-z]+"),
                  }
                  if (
                      ledger_result not in PERMITTED_RESULTS
                      or any(result not in PERMITTED_RESULTS for result in results.values())
                  ):
                      fail("worker result is outside the fixed GitHub needs result set")
                  if ledger_result != "success":
                      results["scaffold-self-check"] = "failure"

              server_url = exact_string(os.environ.get("SERVER_URL"), "SERVER_URL").rstrip("/")
              run_id = expected_value("RUN_ID", r"[1-9][0-9]*")
              target_url = f"{server_url}/{repository}/actions/runs/{run_id}"

              def assert_status_ownership() -> None:
                  statuses = github.pages(
                      f"/repos/{repository}/commits/{expected_head}/statuses?per_page=100",
                      limit=3000,
                  )
                  latest: dict[str, dict[str, object]] = {}
                  for raw in statuses:
                      if not isinstance(raw, dict):
                          fail("commit-status record is malformed")
                      context = raw.get("context")
                      if context in STATUS_CONTEXTS and context not in latest:
                          latest[str(context)] = raw
                  if set(latest) != set(STATUS_CONTEXTS):
                      fail("publisher could not bind every current required status")
                  if any(item.get("target_url") != target_url for item in latest.values()):
                      fail("a newer run owns at least one required status context")

              def post(context: str, state: str, description: str) -> None:
                  if mode == "publisher":
                      assert_status_ownership()
                  revalidate()
                  response = github.request(
                      f"/repos/{repository}/statuses/{expected_head}",
                      method="POST",
                      expected=201,
                      payload={
                          "state": state,
                          "context": context,
                          "description": description,
                          "target_url": target_url,
                      },
                  )
                  if (
                      not isinstance(response, dict)
                      or response.get("state") != state
                      or response.get("context") != context
                      or response.get("sha") != expected_head
                      or response.get("target_url") != target_url
                      or not isinstance(response.get("id"), int)
                      or isinstance(response.get("id"), bool)
                      or response.get("id", 0) <= 0
                  ):
                      fail("commit-status response did not bind the requested state and context")

              try:
                  snap, classification, secure_applicable = revalidate()
                  applicable = {
                      "quality": classification in {"safe", "runtime"},
                      "scaffold-self-check": classification in {"safe", "runtime"},
                      "secure-devcontainer": secure_applicable,
                  }
                  states: dict[str, tuple[str, str]] = {}
                  for context in STATUS_CONTEXTS:
                      if mode == "preflight" and decision == "release":
                          states[context] = ("pending", "isolated exact-head work has not completed")
                      elif classification in {"bootstrap", "invalid"}:
                          states[context] = ("failure", "base-owned admission rejected this change")
                      elif decision == "pending":
                          states[context] = ("pending", "exact human authorization is required")
                      elif decision == "failure":
                          states[context] = ("failure", "authorization is absent or revoked")
                      elif not applicable[context]:
                          if mode == "publisher" and results[context] == "skipped":
                              states[context] = ("success", "not applicable to this exact head")
                          else:
                              states[context] = ("failure", "a non-applicable worker ran unexpectedly")
                      elif mode == "publisher" and results[context] == "success":
                          states[context] = ("success", "isolated worker succeeded on the exact head")
                      else:
                          states[context] = ("failure", "isolated applicable worker did not succeed")
                  if mode == "publisher":
                      assert_status_ownership()
                  # First close at least one required context before attempting
                  # any non-failure state. If a later write becomes uncertain,
                  # the exact-head required wall remains closed.
                  for context in STATUS_CONTEXTS:
                      post(
                          context,
                          "failure",
                          "base-owned publisher is establishing an exact-head baseline",
                      )
                  for context in STATUS_CONTEXTS:
                      state, description = states[context]
                      post(context, state, description)
                  revalidate()
              except GuardError:
                  # Status creation is not atomic. Best-effort rollback targets
                  # only the already accepted SHA and never upgrades a state.
                  try:
                      if mode == "publisher":
                          assert_status_ownership()
                      for context in STATUS_CONTEXTS:
                          try:
                              if mode == "publisher":
                                  assert_status_ownership()
                              github.request(
                                  f"/repos/{repository}/statuses/{expected_head}",
                                  method="POST",
                                  expected=201,
                                  payload={
                                      "state": "failure",
                                      "context": context,
                                      "description": "publisher uncertainty closed the required wall",
                                      "target_url": target_url,
                                  },
                              )
                          except GuardError:
                              pass
                  except GuardError:
                      pass
                  raise
              print("published exact-head statuses: " + ", ".join(STATUS_CONTEXTS))


          def cancel_runs() -> None:
              repository, base_repository_id, _ = require_repository()
              github = GitHub()
              if expected_value("RUN_ATTEMPT", r"[1-9][0-9]*") != "1":
                  fail("cancellation refuses a rerun attempt")
              default_branch = repository_default_branch(
                  github, repository, base_repository_id
              )
              pr_number = int(expected_value("ACCEPTED_PR", r"[1-9][0-9]*"))
              accepted_head = expected_value("ACCEPTED_HEAD", r"[0-9a-f]{40}")
              accepted_repository = expected_value(
                  "ACCEPTED_REPOSITORY", r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
              )
              accepted_repository_id = int(
                  expected_value("ACCEPTED_REPOSITORY_ID", r"[1-9][0-9]*")
              )
              accepted_base = expected_value("ACCEPTED_BASE", r"[0-9a-f]{40}")
              accepted_auth = int(
                  expected_value("ACCEPTED_AUTH_COMMENT", r"0|[1-9][0-9]*")
              )
              current_run = int(expected_value("RUN_ID", r"[1-9][0-9]*"))
              scope = expected_value("CANCEL_SCOPE", r"prior-head|current-head")
              if scope == "prior-head":
                  live = snapshot(
                      github.request(f"/repos/{repository}/pulls/{pr_number}"),
                      repository,
                      base_repository_id,
                  )
                  if (
                      live["number"] != pr_number
                      or live["head_sha"] != accepted_head
                      or live["head_repo_id"] != accepted_repository_id
                      or live["head_repository"] != accepted_repository
                      or live["base_sha"] != accepted_base
                      or live["base_ref"] != default_branch
                  ):
                      fail("prior-head cancellation rejected stale pull request identity")
              runs_by_id: dict[int, dict[str, object]] = {}
              active_statuses = {
                  "requested", "waiting", "pending", "queued", "in_progress"
              }
              for status_filter in (
                  "requested", "waiting", "pending", "queued", "in_progress"
              ):
                  for raw in github.object_pages(
                      f"/repos/{repository}/actions/workflows/ci.yml/runs"
                      f"?status={status_filter}&per_page=100",
                      "workflow_runs",
                      limit=3000,
                  ):
                      if not isinstance(raw, dict):
                          fail("workflow-run record is malformed")
                      identifier = positive_integer(raw.get("id"), "workflow run id")
                      if raw.get("status") not in active_statuses:
                          fail("active workflow-run query returned a non-active run")
                      if not workflow_path_is_ci(raw.get("path"), default_branch):
                          fail("active workflow-run path is not the trusted CI workflow")
                      previous = runs_by_id.get(identifier)
                      if previous is not None:
                          immutable_fields = (
                              "id", "event", "display_title", "workflow_id",
                              "run_number", "head_branch", "head_sha",
                              "html_url", "jobs_url",
                          )
                          if any(
                              previous.get(field) != raw.get(field)
                              for field in immutable_fields
                          ):
                              fail(
                                  "active workflow-run identity disagreed across status queries"
                              )
                      runs_by_id[identifier] = raw
              title = f"CI admission PR #{pr_number}"
              cancelled = 0
              for raw in runs_by_id.values():
                  if not isinstance(raw, dict):
                      fail("workflow-run record is malformed")
                  identifier = positive_integer(raw.get("id"), "workflow run id")
                  if identifier == current_run or raw.get("status") not in active_statuses:
                      continue
                  if (
                      not workflow_path_is_ci(raw.get("path"), default_branch)
                      or raw.get("display_title") != title
                      or raw.get("event") not in {"pull_request_target", "issue_comment"}
                  ):
                      continue
                  jobs = github.object_pages(
                      f"/repos/{repository}/actions/runs/{identifier}/jobs?filter=latest&per_page=100",
                      "jobs",
                      limit=3000,
                  )
                  bindings: set[tuple[int, int, str, str, int]] = set()
                  for job in jobs:
                      if not isinstance(job, dict) or not isinstance(job.get("name"), str):
                          fail("workflow job record is malformed")
                      match = WORKER_NAME.fullmatch(job["name"])
                      if match:
                          bindings.add(
                              (
                                  int(match.group(1)),
                                  int(match.group(2)),
                                  match.group(3),
                                  match.group(4),
                                  int(match.group(5)),
                              )
                          )
                  if len(bindings) != 1:
                      continue
                  binding = next(iter(bindings))
                  eligible = (
                      binding[0] == pr_number
                      and binding[1] == accepted_repository_id
                      and (
                          (scope == "prior-head" and binding[2] != accepted_head)
                          or (
                              scope == "current-head"
                              and binding[2] == accepted_head
                              and binding[4] == accepted_auth
                          )
                      )
                  )
                  if not eligible:
                      continue
                  try:
                      github.request(
                          f"/repos/{repository}/actions/runs/{identifier}/cancel",
                          method="POST",
                          payload={},
                          expected=202,
                      )
                      cancelled += 1
                  except GuardError as error:
                      print(f"best-effort cancellation failed for run {identifier}: {error}")
              print(f"best-effort cancellation requests accepted: {cancelled}")


          def main() -> None:
              mode = exact_string(os.environ.get("TASK35_MODE"), "TASK35_MODE")
              if mode == "admission":
                  admission()
              elif mode in {"preflight", "publisher"}:
                  publisher()
              elif mode == "cancel":
                  cancel_runs()
              else:
                  fail("TASK35_MODE is not a supported fixed mode")


          try:
              main()
          except GuardError as error:
              raise SystemExit(f"base-owned admission failure: {error}") from error
          PY
          # TASK35_PROGRAM_END controller

  cancellation-controller:
    name: isolated authorization cancellation
    needs: admission-controller
    if: >-
      github.run_attempt == 1 &&
      needs.admission-controller.outputs.cancel == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Cancel only prior runs bound to this pull request
        env:
          TASK35_MODE: cancel
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          API_URL: ${{ github.api_url }}
          GRAPHQL_URL: ${{ github.graphql_url }}
          ACCEPTED_PR: ${{ needs.admission-controller.outputs.pr_number }}
          ACCEPTED_HEAD: ${{ needs.admission-controller.outputs.head_sha }}
          ACCEPTED_REPOSITORY: ${{ needs.admission-controller.outputs.head_repository }}
          ACCEPTED_REPOSITORY_ID: ${{ needs.admission-controller.outputs.head_repository_id }}
          ACCEPTED_BASE: ${{ needs.admission-controller.outputs.base_sha }}
          ACCEPTED_AUTH_COMMENT: ${{ needs.admission-controller.outputs.auth_comment_id }}
          CANCEL_SCOPE: ${{ needs.admission-controller.outputs.cancel_scope }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: *task35-controller

  status-preflight:
    name: isolated exact-head status preflight
    needs: admission-controller
    if: needs.admission-controller.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Revalidate and close the required wall before candidate work
        env:
          TASK35_MODE: preflight
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          API_URL: ${{ github.api_url }}
          GRAPHQL_URL: ${{ github.graphql_url }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          ACCEPTED_PR: ${{ needs.admission-controller.outputs.pr_number }}
          ACCEPTED_HEAD: ${{ needs.admission-controller.outputs.head_sha }}
          ACCEPTED_REPOSITORY: ${{ needs.admission-controller.outputs.head_repository }}
          ACCEPTED_REPOSITORY_ID: ${{ needs.admission-controller.outputs.head_repository_id }}
          ACCEPTED_BASE: ${{ needs.admission-controller.outputs.base_sha }}
          ACCEPTED_CHANGED_FILES: ${{ needs.admission-controller.outputs.changed_files }}
          ACCEPTED_DIFF_DIGEST: ${{ needs.admission-controller.outputs.diff_digest }}
          ACCEPTED_CLASS: ${{ needs.admission-controller.outputs.classification }}
          ACCEPTED_SECURE: ${{ needs.admission-controller.outputs.secure_applicable }}
          DECISION: ${{ needs.admission-controller.outputs.decision }}
          DECISION_REASON: ${{ needs.admission-controller.outputs.reason }}
          ACCEPTED_AUTH_COMMENT: ${{ needs.admission-controller.outputs.auth_comment_id }}
        run: *task35-controller

  candidate-quality-worker:
    name: >-
      isolated candidate quality worker
      pr-${{ needs.admission-controller.outputs.pr_number }}
      repo-${{ needs.admission-controller.outputs.head_repository_id }}
      head-${{ needs.admission-controller.outputs.head_sha }}
      base-${{ needs.admission-controller.outputs.base_sha }}
      auth-${{ needs.admission-controller.outputs.auth_comment_id }}
    needs: [admission-controller, status-preflight]
    if: >-
      github.run_attempt == 1 &&
      needs.status-preflight.result == 'success' &&
      needs.admission-controller.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse job-only reruns before candidate checkout
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]]

      - name: Check out the exact admitted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.admission-controller.outputs.head_repository }}
          ref: ${{ needs.admission-controller.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact repository and head
        env:
          ACCEPTED_HEAD: ${{ needs.admission-controller.outputs.head_sha }}
          ACCEPTED_REPOSITORY: ${{ needs.admission-controller.outputs.head_repository }}
        run: |
          set -euo pipefail
          [[ "$ACCEPTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCEPTED_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$ACCEPTED_HEAD" ]]
          remote="$(git remote get-url origin)"
          [[ "$remote" == "https://github.com/$ACCEPTED_REPOSITORY" || \
             "$remote" == "https://github.com/$ACCEPTED_REPOSITORY.git" ]]

      - name: Show measured scaffold onboarding status
        run: .github/scripts/tuning-status.sh --ci

  candidate-scaffold-worker:
    name: >-
      isolated candidate scaffold worker
      pr-${{ needs.admission-controller.outputs.pr_number }}
      repo-${{ needs.admission-controller.outputs.head_repository_id }}
      head-${{ needs.admission-controller.outputs.head_sha }}
      base-${{ needs.admission-controller.outputs.base_sha }}
      auth-${{ needs.admission-controller.outputs.auth_comment_id }}
    needs: [admission-controller, status-preflight]
    if: >-
      github.run_attempt == 1 &&
      needs.status-preflight.result == 'success' &&
      needs.admission-controller.outputs.run_scaffold == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse job-only reruns before candidate checkout
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]]

      - name: Check out the exact admitted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.admission-controller.outputs.head_repository }}
          ref: ${{ needs.admission-controller.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact repository, head, whitespace, and shell syntax
        env:
          ACCEPTED_BASE: ${{ needs.admission-controller.outputs.base_sha }}
          ACCEPTED_HEAD: ${{ needs.admission-controller.outputs.head_sha }}
          ACCEPTED_REPOSITORY: ${{ needs.admission-controller.outputs.head_repository }}
          BASE_REPOSITORY: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          [[ "$ACCEPTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCEPTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCEPTED_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$BASE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$BASE_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          [[ "$(git rev-parse HEAD)" == "$ACCEPTED_HEAD" ]]
          remote="$(git remote get-url origin)"
          [[ "$remote" == "https://github.com/$ACCEPTED_REPOSITORY" || \
             "$remote" == "https://github.com/$ACCEPTED_REPOSITORY.git" ]]
          # A fork need not contain the current upstream base object. Fetch
          # only the already admitted base SHA from the fixed public base URL,
          # without a credential helper or a persistent ref.
          git -c credential.helper= fetch \
            --no-tags --no-recurse-submodules --depth=1 \
            "https://github.com/$BASE_REPOSITORY.git" "$ACCEPTED_BASE"
          git cat-file -e "$ACCEPTED_BASE^{commit}"
          git diff --check "$ACCEPTED_BASE" "$ACCEPTED_HEAD"
          scaffold_shells=()
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/scripts/*.sh|.agents/*.sh|.codex/devcontainer/*.sh)
                scaffold_shells+=("$path")
                ;;
            esac
          done < <(git ls-files -z -- .github/scripts .agents .codex/devcontainer)
          ((${#scaffold_shells[@]} > 0))
          bash -n "${scaffold_shells[@]}"

      - name: Check shell scripts with ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          scaffold_shells=()
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/scripts/*.sh|.agents/*.sh|.codex/devcontainer/*.sh)
                scaffold_shells+=("$path")
                ;;
            esac
          done < <(git ls-files -z -- .github/scripts .agents .codex/devcontainer)
          ((${#scaffold_shells[@]} > 0))
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            -S warning "${scaffold_shells[@]}"

      - name: Validate GitHub workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          workflow_files=()
          while IFS= read -r -d '' workflow_file; do
            case "$workflow_file" in
              *.yml|*.yaml) workflow_files+=("$workflow_file") ;;
            esac
          done < <(git ls-files -z -- .github/workflows)
          ((${#workflow_files[@]} > 0))
          "$RUNNER_TEMP/actionlint" -color "${workflow_files[@]}"

      - name: Run deterministic scaffold validators
        run: |
          set -euo pipefail
          .github/scripts/check-md-links.sh
          .github/scripts/check-template-sync.sh
          .github/scripts/check-skills.sh
          .github/scripts/check-connectors.sh
          .github/scripts/check-workflow-permissions.sh
          .github/scripts/check-escalation-wording.sh
          .github/scripts/check-changelog-refs.sh
          python3 .github/scripts/check_action_pins.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
          .github/scripts/tests/run-portable-tests.sh

  candidate-secure-runtime:
    name: >-
      isolated native runtime worker (${{ matrix.architecture }})
      pr-${{ needs.admission-controller.outputs.pr_number }}
      repo-${{ needs.admission-controller.outputs.head_repository_id }}
      head-${{ needs.admission-controller.outputs.head_sha }}
      base-${{ needs.admission-controller.outputs.base_sha }}
      auth-${{ needs.admission-controller.outputs.auth_comment_id }}
    needs: [admission-controller, status-preflight]
    if: >-
      github.run_attempt == 1 &&
      needs.status-preflight.result == 'success' &&
      needs.admission-controller.outputs.run_secure == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: linux/amd64
            runner: ubuntu-24.04
            node_arch: x64
          - architecture: linux/arm64
            runner: ubuntu-24.04-arm
            node_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Refuse job-only reruns before candidate checkout
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == "1" ]]

      - name: Check out the exact authorized runtime head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.admission-controller.outputs.head_repository }}
          ref: ${{ needs.admission-controller.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact authorized source
        env:
          ACCEPTED_HEAD: ${{ needs.admission-controller.outputs.head_sha }}
          ACCEPTED_REPOSITORY: ${{ needs.admission-controller.outputs.head_repository }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$ACCEPTED_HEAD" ]]
          remote="$(git remote get-url origin)"
          [[ "$remote" == "https://github.com/$ACCEPTED_REPOSITORY" || \
             "$remote" == "https://github.com/$ACCEPTED_REPOSITORY.git" ]]
          [[ "$(node -p 'process.arch')" == "$EXPECTED_NODE_ARCH" ]]
          [[ -x .codex/devcontainer/tests/ci-runtime.sh ]]
          [[ -f .github/scripts/preflight_devcontainer.py ]]

      - name: Install the checksum-pinned Dev Container CLI
        env:
          DEVCONTAINER_CLI_VERSION: 0.88.0
          DEVCONTAINER_CLI_SHA512: b0c92bb8fcbf89c7e8bf6d26750876123158668831bcc119a6d0c4be0e7f78c04850eaf6c6bfbcc25b08ee7bc347a109c68063aa86ac5ea81119b88ca9b689d7
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/devcontainers-cli.tgz"
          cli_root="$RUNNER_TEMP/devcontainer-cli"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://registry.npmjs.org/@devcontainers/cli/-/cli-${DEVCONTAINER_CLI_VERSION}.tgz" \
            --output "$archive"
          printf '%s  %s\n' "$DEVCONTAINER_CLI_SHA512" "$archive" \
            | sha512sum --check --strict
          install -d -m 0700 "$cli_root"
          tar -xzf "$archive" -C "$cli_root" --strip-components=1 \
            --no-same-owner --no-same-permissions
          [[ -f "$cli_root/devcontainer.js" && ! -L "$cli_root/devcontainer.js" ]]
          chmod 0500 "$cli_root/devcontainer.js"
          [[ "$("$cli_root/devcontainer.js" --version)" == "$DEVCONTAINER_CLI_VERSION" ]]

      - name: Run the authorized native secure runtime wall
        env:
          ACCEPTED_HEAD: ${{ needs.admission-controller.outputs.head_sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          .codex/devcontainer/tests/ci-runtime.sh run \
            --architecture "$ARCHITECTURE" \
            --repository "$GITHUB_WORKSPACE" \
            --commit "$ACCEPTED_HEAD" \
            --preflight "$GITHUB_WORKSPACE/.github/scripts/preflight_devcontainer.py" \
            --devcontainer-cli "$RUNNER_TEMP/devcontainer-cli/devcontainer.js" \
            --evidence "$RUNNER_TEMP/evidence.json" \
            --state "$RUNNER_TEMP/state.json"

  trusted-ledger-worker:
    name: base-owned Task ledger and retro worker
    needs: [admission-controller, status-preflight]
    if: >-
      needs.status-preflight.result == 'success' &&
