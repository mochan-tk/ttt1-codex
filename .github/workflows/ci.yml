name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  denied-pull-request-must-not-run:
    name: POLICY FAILURE - denied pull_request reached a runner
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed if workflow execution protection did not deny the event
        run: 'exit 1'
